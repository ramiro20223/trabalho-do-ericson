<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>📚 Biblioteca</h1>
    <p>Cadastre, edite e exclua os livros do acervo.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="titulo-form">Cadastrar livro</h2>
      <form id="form-livro" autocomplete="off">
        <input type="hidden" id="livro-id">

        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" required maxlength="120" placeholder="Ex.: Dom Casmurro">
        </div>

        <div class="campo">
          <label for="autor">Autor</label>
          <input type="text" id="autor" required maxlength="80" placeholder="Ex.: Machado de Assis">
        </div>

        <div class="linha">
          <div class="campo">
            <label for="ano">Ano</label>
            <input type="number" id="ano" min="1" max="2100" placeholder="1899">
          </div>

          <div class="campo">
            <label for="genero">Gênero</label>
            <input type="text" id="genero" maxlength="40" placeholder="Romance">
          </div>

          <div class="campo">
            <label for="status">Status</label>
            <select id="status">
              <option value="Disponível">Disponível</option>
              <option value="Emprestado">Emprestado</option>
            </select>
          </div>
        </div>

        <div class="botoes">
          <button type="submit" id="btn-salvar" class="btn btn-primario">Cadastrar</button>
          <button type="button" id="btn-cancelar" class="btn btn-secundario" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="lista-topo">
        <h2>Acervo <span id="contador" class="contador">0</span></h2>
        <input type="search" id="busca" placeholder="Buscar por título, autor ou gênero...">
      </div>

      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Autor</th>
              <th>Ano</th>
              <th>Gênero</th>
              <th>Status</th>
              <th class="acoes-col">Ações</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>

      <p id="vazio" class="vazio" hidden>Nenhum livro encontrado.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
